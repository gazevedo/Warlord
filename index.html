<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#79cceb">
  <title>Warlord — Reino de Valoria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@700;800;900&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game" aria-label="Mapa do reino de Valoria">
    <section class="world-viewport" id="world-viewport" aria-label="Mundo 3D interativo. Arraste para mover e use os controles para ampliar.">
      <div class="clouds" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="world" id="world">
        <div class="terrain">
          <div class="terrain-grid" aria-hidden="true"></div>
          <div class="river" aria-hidden="true"></div>
          <div class="lake" aria-hidden="true"></div>
          <div class="road road-a" aria-hidden="true"></div>
          <div class="road road-b" aria-hidden="true"></div>
          <div class="mountains" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <div class="forest forest-a" aria-hidden="true"></div>
          <div class="forest forest-b" aria-hidden="true"></div>
          <div class="rocks" aria-hidden="true"><i></i><i></i><i></i></div>
          <div id="cities"></div>
          <div id="marches"></div>
        </div>
      </div>
      <p class="map-hint" id="map-hint">Arraste para explorar • toque em uma cidade</p>
    </section>

    <header class="top-hud" aria-label="Status do jogador">
      <button class="avatar hud-button" aria-label="Abrir perfil"><span class="wolf-mark">♞</span><i>42</i></button>
      <div class="player-summary"><strong>Lord Azevedo</strong><span>⚔ 1.284.320</span></div>
      <div class="resources" aria-label="Recursos">
        <button class="resource" aria-label="Madeira: 1,2 milhão"><span>🪵</span><b>1,2M</b></button>
        <button class="resource" aria-label="Pedra: 980 mil"><span>⬡</span><b>980K</b></button>
        <button class="resource metal" aria-label="Metal: 740 mil"><span>◆</span><b>740K</b></button>
        <button class="resource coins" aria-label="Moedas: 2,3 milhões"><span>●</span><b>2,3M</b></button>
        <button class="resource premium" aria-label="Gemas: 680"><span>◆</span><b>680</b></button>
      </div>
      <button class="round-button notification" aria-label="Mensagens, 3 novas">✉<i>3</i></button>
    </header>

    <nav class="side-actions" aria-label="Atalhos">
      <button class="action-button" data-toast="Eventos do reino"><span>🏆</span><b>Eventos</b><i>2</i></button>
      <button class="action-button" data-toast="Missões diárias"><span>📜</span><b>Missões</b></button>
      <button class="action-button" data-toast="Loja do reino"><span>🎪</span><b>Loja</b></button>
    </nav>

    <div class="zoom-controls" aria-label="Controles do mapa">
      <button id="zoom-in" aria-label="Aproximar">+</button>
      <button id="zoom-out" aria-label="Afastar">−</button>
      <button id="recenter" aria-label="Centralizar mapa">⌖</button>
    </div>

    <aside class="city-panel" id="city-panel" aria-live="polite" aria-hidden="true">
      <button class="close-panel" id="close-panel" aria-label="Fechar detalhes">×</button>
      <div class="city-crest" id="panel-crest">♜</div>
      <div class="city-copy">
        <span id="panel-owner">Aliança</span>
        <h2 id="panel-name">Cidade</h2>
        <p><b id="panel-level">Nível 1</b> · <span id="panel-troops">0 tropas</span></p>
      </div>
      <div class="city-actions">
        <button data-action="Visão da cidade"><span>👁</span>Visitar</button>
        <button class="primary" id="attack-action"><span>⚔</span><span id="attack-label">Atacar</span></button>
        <button data-action="Batedor enviado"><span>🔭</span>Espionar</button>
      </div>
    </aside>

    <dialog class="attack-dialog" id="attack-dialog">
      <form method="dialog" id="attack-form">
        <button class="close-panel" value="cancel" aria-label="Cancelar ataque">×</button>
        <span class="dialog-kicker">ORDEM DE MARCHA</span>
        <h2><span id="attack-origin">Origem</span> → <span id="attack-target">Destino</span></h2>
        <label for="attack-troops">Tropas enviadas</label>
        <div class="troop-input"><input id="attack-troops" name="troops" type="number" min="1" step="1" required><button type="button" id="attack-max">MÁX.</button></div>
        <div class="attack-estimate"><span>Distância <b id="attack-distance">0</b></span><span>Chegada <b id="attack-duration">00:00</b></span></div>
        <p class="form-error" id="attack-error" role="alert"></p>
        <button class="confirm-attack" value="confirm">Confirmar ataque</button>
      </form>
    </dialog>

    <aside class="attack-alert" id="attack-alert" hidden><button id="focus-attack"><strong>⚠ ATAQUE RECEBIDO</strong><span id="alert-time">00:00</span></button></aside>

    <aside class="alliance-chat" aria-label="Conversa da aliança">
      <p><b>[BR1] Lucas:</b> Reforço a caminho!</p>
      <p><b>[BR1] Marina:</b> Boa!</p>
      <p><b class="enemy-chat">[WOL] Dark:</b> Alguém online?</p>
    </aside>

    <dialog class="battle-report" id="battle-report">
      <form method="dialog">
        <span class="dialog-kicker">RELATÓRIO DE BATALHA</span>
        <h2 id="report-result">VITÓRIA</h2>
        <div id="report-content"></div>
        <button class="confirm-attack">Voltar ao mapa</button>
      </form>
    </dialog>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <button class="active"><span>🌎</span><b>Mundo</b></button>
      <button data-toast="Gestão da sua cidade"><span>🏰</span><b>Cidade</b></button>
      <button class="army-nav" data-toast="Exércitos em marcha"><span>⚔️</span><b>Exército</b><i>1</i></button>
      <button data-toast="Aliança Guardiões"><span>🛡️</span><b>Aliança</b></button>
      <button data-toast="Mais opções"><span>☰</span><b>Mais</b></button>
    </nav>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="battle-engine.js"></script>
  <script src="script.js"></script>
</body>
</html>
