<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Warlord — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Nunito:wght@700;800;900&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-world">
    <div class="login-map" aria-hidden="true"></div>
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand-crest">W</div>
      <p class="eyebrow">REINO DE VALORIA</p>
      <h1 id="login-title">WARLORD</h1>
      <p class="welcome">Comande cidades. Conquiste reinos.</p>
      <form>
        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="seu@email.com" autocomplete="email">
        <label for="password">Senha</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
        <div class="form-links"><label><input type="checkbox"> Lembrar-me</label><a href="#">Esqueci a senha</a></div>
        <button class="login-button" type="submit">ENTRAR NO REINO</button>
        <div class="divider"><span>ou</span></div>
        <button class="google-button" type="button"><b>G</b> Continuar com Google</button>
      </form>
      <p class="signup">Novo comandante? <a href="#">Criar conta</a></p>
    </section>
  </main>
</body>
</html>
